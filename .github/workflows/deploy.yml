name: Production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whether deploy is enabled
        id: deploy_config
        env:
          DEPLOY_GITHUB_ACTIONS_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          enabled="$(php deploy.php --check-github-actions-enabled)"
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Deploy skipped because deploy.config.php / DEPLOY_ENABLED does not enable GitHub Actions deploy."
          fi

      - name: Setup Node.js
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure SSH key
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run deploy
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          DEPLOY_GITHUB_ACTIONS_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
          DEPLOY_BACKUP_DIR: ${{ secrets.DEPLOY_BACKUP_DIR }}
          DEPLOY_RUN_MIGRATIONS: ${{ vars.DEPLOY_RUN_MIGRATIONS }}
          DEPLOY_MAINTENANCE_ENABLED: ${{ vars.DEPLOY_MAINTENANCE_ENABLED }}
          DEPLOY_DB_BACKUP_ENABLED: ${{ vars.DEPLOY_DB_BACKUP_ENABLED }}
          DEPLOY_DB_BACKUP_RETENTION_DAYS: ${{ vars.DEPLOY_DB_BACKUP_RETENTION_DAYS }}
          DEPLOY_DB_BACKUP_CRON: ${{ vars.DEPLOY_DB_BACKUP_CRON }}
          DEPLOY_DB_BACKUP_REGISTER_CRON: ${{ vars.DEPLOY_DB_BACKUP_REGISTER_CRON }}
          DEPLOY_SSH_KEY_PATH: ~/.ssh/deploy_key
        run: php deploy.php --yes
