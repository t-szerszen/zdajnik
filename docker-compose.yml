services:
  app:
    build: .
    container_name: examly_app
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/html
    networks:
      - examly_network
    depends_on:
      - db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}

  db:
    image: mysql:8.0
    container_name: examly_db
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - examly_network

networks:
  examly_network:
    driver: bridge

volumes:
  db_data:
