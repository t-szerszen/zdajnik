name: zdajnik

services:
  app:
    build: .
    container_name: zdajnik-app
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/var/www/html
    networks:
      - zdajnik_network
    depends_on:
      - db
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}

  db:
    image: mysql:8.0
    container_name: zdajnik-db
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - zdajnik_db_data:/var/lib/mysql
    networks:
      - zdajnik_network

networks:
  zdajnik_network:
    name: zdajnik_network
    driver: bridge

volumes:
  zdajnik_db_data:
    name: zdajnik_db_data
